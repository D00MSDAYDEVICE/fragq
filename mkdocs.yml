site_name: FragQ Documentation
site_description: Self-hosted Discord pickup-game bot with a web control panel, based on PUBobot2.
site_url: https://d00msdaydevice.github.io/fragq/
repo_url: https://github.com/D00MSDAYDEVICE/fragq
repo_name: D00MSDAYDEVICE/fragq
edit_uri: edit/main/docs/
copyright: FragQ is free software, licensed under the GNU GPL v3. Based on PUBobot2 by Leshaka.

docs_dir: docs
site_dir: site

validation:              # with --strict, broken links and #anchors fail the build
  links:
    anchors: warn

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/logo.svg
  font: false            # system UI text; headings and code use the app's bundled fonts (extra.css)
  palette:
    - scheme: slate
      toggle:
        icon: material/brightness-7
        name: Switch to light mode
    - scheme: default
      toggle:
        icon: material/brightness-4
        name: Switch to dark mode
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.instant
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/extra.css

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:      # docs/project/changelog.md includes CHANGELOG.md from the repository root
      base_path: ["."]
      check_paths: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.keys
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started:
      - What Is FragQ?: getting-started/introduction.md
      - Discord Application: getting-started/discord-app.md
      - Installation: getting-started/installation.md
      - First Channel And Queue: getting-started/first-steps.md
  - Playing:
      - Joining Queues: playing/joining.md
      - Matches: playing/matches.md
      - Ratings And Leaderboard: playing/ratings.md
      - Linking Steam: playing/steam.md
  - Web Panel:
      - Navigating The Panel: web-panel/overview.md
      - Channel And Queue Settings: web-panel/settings-editor.md
      - Live, Leaderboard And Matches: web-panel/live-and-stats.md
      - Import And Export: web-panel/import-export.md
  - Discord Queue Panel:
      - The Queue Panel: queue-panel/panel.md
      - Moderator Buttons: queue-panel/moderators.md
      - Match Start Message: queue-panel/match-message.md
  - Connectors (Beta):
      - Game Connectors: connectors/index.md
      - Quake Live (minqlx): connectors/quake-live.md
      - Result Format: connectors/result-format.md
  - Reference:
      - Commands: reference/commands.md
      - Channel Settings: reference/channel-settings.md
      - Queue Settings: reference/queue-settings.md
  - Administration:
      - Web Panel Access: administration/access.md
      - Settings Page: administration/settings-page.md
      - Steam Integration: administration/steam.md
      - .env Reference: administration/env.md
      - HTTPS And Ports: administration/https.md
      - Moving From PUBobot2: administration/pubobot2.md
      - Updating: administration/updating.md
      - Backup And Restore: administration/backup-restore.md
  - Help:
      - Troubleshooting: help/troubleshooting.md
  - Project:
      - Changelog: project/changelog.md
      - Development: project/development.md
      - Credits And License: project/license.md
