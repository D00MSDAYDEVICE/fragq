# Fixed project name: volumes are always fragq_fragq_data etc., whatever the folder is called,
# so extracting a new release into a differently named folder keeps the data.
name: fragq

services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${MYSQL_DATABASE:-fragq}
      MARIADB_USER: ${MYSQL_USER:-fragq}
      MARIADB_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_general_ci"]
    volumes:
      - db_data:/var/lib/mysql
      - ./backups:/backups
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  app:
    build: ./app
    image: fragq:latest
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
      MYSQL_HOST: db
      WEB_PORT: "8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - fragq_data:/data
    expose:
      - "8000"
    # Allow time to save queue/match state on shutdown.
    stop_grace_period: 30s

  caddy:
    image: caddy:2.11-alpine
    restart: unless-stopped
    depends_on:
      - app
    env_file: .env
    entrypoint: ["/bin/sh", "/fragq-entrypoint.sh"]
    ports:
      - "${HTTP_PORT:-80}:${HTTP_PORT:-80}"
      - "${HTTPS_PORT:-443}:${HTTPS_PORT:-443}"
      - "${HTTPS_PORT:-443}:${HTTPS_PORT:-443}/udp"
    volumes:
      - ./caddy/entrypoint.sh:/fragq-entrypoint.sh:ro
      - ./certs:/certs:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  db_data:
  fragq_data:
  caddy_data:
  caddy_config:
